# FSVR MPC skin layout, seven tabs:
#   PERFORM  factory performance (knob + LOAD), RANDOM by category, PANIC
#   VOWEL    vowel, voice type and EG shape (popups), breath and body, MAKE and RND VOWEL
#   FSEQ     preset formant sequence (knob, 0 = off), RND FSEQ, speed
#   MUTATE   amount + MUTATE, UNDO, SAVE, user slot + USER LOAD
#   SOUND    the FS1R's Formant/FM knobs, the part's filter and EG offsets
#   MOD/FX   LFO, vibrato, the two effect sends, volume, mono and glide
#   VOCODER  on/off, WAV from fsvr_vox, mode (NOTE, LOOP, BAR), bands, start, speed, shift, sibilance, mix
# Palette: FS1R front panel, charcoal with the amber of its LCD.
style=td3
theme_bg=2a2c2e
theme_panel=2a2c2e
theme_line=0c0d0e
theme_ink=e8e4da
theme_ink_dim=9a978f
theme_ink_faint=5f5d58
theme_accent=f0a020
theme_accent_hi=ffc45c
theme_knob_face=3c3f42
theme_knob_ring=080808
theme_bar=f0a020
theme_seg_active=f0a020
theme_seg_inactive=3c3f42
theme_seg_active_tx=1a1b1c
theme_btn_text=1a1b1c
theme_well=0c0d0e
theme_knob_off=55585b
theme_tab_on=f0a020
theme_tab_on_tx=1a1b1c
theme_lcd=1a1408
theme_box=1a1b1c
theme_btn_bg=e8e4da
theme_chrome_ink=e8e4da
theme_go_on=f0a020
theme_go_off=ff6b4a
theme_tabs=f0a020

[tab PERFORM]
frame x=36 y=88 w=1207 h=624 title="PERFORMANCE"
knob cx=220 cy=280 r=34 label="PERF" key=perf
button cx=440 cy=280 label="LOAD" key=perf_load
button cx=1060 cy=280 label="PANIC" key=panic
popup cx=350 cy=480 w=260 h=48 label="CATEGORY" key=rand_cat
button cx=640 cy=480 label="RANDOM" key=rand_go
qlinks "PERFORM" = perf,perf_load,rand_cat,rand_go,panic

[tab VOWEL]
frame x=36 y=88 w=1207 h=624 title="VOWEL"
popup cx=200 cy=200 w=200 h=48 label="VOWEL" key=vowel
popup cx=470 cy=200 w=220 h=48 label="VOICE" key=vtype
popup cx=750 cy=200 w=200 h=48 label="SHAPE" key=shape
knob cx=220 cy=440 r=34 label="BREATH" key=breath
knob cx=460 cy=440 r=34 label="BODY" key=body
button cx=760 cy=440 label="MAKE" key=make
button cx=1000 cy=440 label="RND VOWEL" key=rand_vowel
qlinks "VOWEL" = vowel,vtype,shape,breath,body,make,rand_vowel

[tab FSEQ]
frame x=36 y=88 w=1207 h=624 title="FORMANT SEQUENCE"
knob cx=260 cy=330 r=34 label="FSEQ" key=fseq
button cx=520 cy=330 label="RND FSEQ" key=fseq_rand
knob cx=820 cy=330 r=34 label="SPEED" key=fseq_speed
qlinks "FSEQ" = fseq,fseq_rand,fseq_speed

[tab MUTATE]
frame x=36 y=88 w=1207 h=624 title="MUTATE / LIBRARY"
knob cx=220 cy=260 r=34 label="AMOUNT" key=mut_amt
button cx=440 cy=260 label="MUTATE" key=mutate
button cx=700 cy=260 label="UNDO" key=undo
button cx=440 cy=500 label="SAVE" key=save
knob cx=700 cy=500 r=34 label="USER" key=user
button cx=940 cy=500 label="USER LOAD" key=user_load
qlinks "MUTATE" = mut_amt,mutate,undo,save,user,user_load

[tab SOUND]
frame x=36 y=88 w=1207 h=624 title="SOUND"
knob cx=200 cy=260 r=34 label="FORMANT" key=formant
knob cx=420 cy=260 r=34 label="FM" key=fm
knob cx=700 cy=260 r=34 label="CUTOFF" key=cutoff
knob cx=900 cy=260 r=34 label="RESO" key=reso
knob cx=360 cy=520 r=34 label="ATTACK" key=attack
knob cx=640 cy=520 r=34 label="DECAY" key=decay
knob cx=920 cy=520 r=34 label="RELEASE" key=release
qlinks "SOUND" = formant,fm,cutoff,reso,attack,decay,release

[tab MOD/FX]
frame x=36 y=88 w=1207 h=624 title="MOD / FX"
knob cx=200 cy=260 r=34 label="LFO SPEED" key=lfo_speed
knob cx=420 cy=260 r=34 label="VIBRATO" key=lfo_pitch
knob cx=200 cy=520 r=34 label="REVERB" key=rev_send
knob cx=420 cy=520 r=34 label="VARIATION" key=var_send
knob cx=1040 cy=400 r=34 label="VOLUME" key=volume
enum_h cx=720 cy=260 label="VOICES" key=mono sw=90
knob cx=720 cy=520 r=34 label="GLIDE" key=glide
qlinks "MOD/FX" = lfo_speed,lfo_pitch,rev_send,var_send,volume,mono,glide

[tab VOCODER]
frame x=36 y=88 w=1207 h=624 title="VOCODER"
toggle cx=110 cy=200 label="VOCODER" key=voc_on
knob cx=320 cy=220 r=34 label="VOX FILE" key=voc_file
enum_h cx=640 cy=200 label="MODE" key=voc_mode sw=90
enum_h cx=1000 cy=200 label="BANDS" key=voc_bands sw=70
knob cx=200 cy=500 r=34 label="START" key=voc_start
knob cx=400 cy=500 r=34 label="SPEED" key=voc_speed
knob cx=600 cy=500 r=34 label="SHIFT" key=voc_shift
knob cx=800 cy=500 r=34 label="SIBILANCE" key=voc_hf
knob cx=1040 cy=480 r=34 label="MIX" key=voc_mix
qlinks "VOCODER" = voc_on,voc_file,voc_mode,voc_bands,voc_start,voc_speed,voc_shift,voc_hf,voc_mix
