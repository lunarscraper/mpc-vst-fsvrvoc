name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.4.0
        required: true
        default: 0.4.1
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  fsvr:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@259f75d0ce0f836cfd89cc0a33c550b55917cffc
    permissions:
      contents: write
    with:
      tag: fsvr-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 259f75d0ce0f836cfd89cc0a33c550b55917cffc
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: fsvr
      license: GPL-3.0
      about: Yamaha FS1R reconstruction (FSVR engine) - vowel and formant generator, Fseq, mutate, WAV vocoder, 384 factory performances.
      dry_run: ${{ inputs.dry_run }}
